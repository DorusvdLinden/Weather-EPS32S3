; PlatformIO project for the ESP32-S3 weather display.
; See README.md for the full architecture/plan this implements.

[base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash / 8MB octal PSRAM. Required - the RGB working canvas
; alone is ~1.1MB and does not fit in the ~512KB internal SRAM alongside
; WiFi/TLS buffers. Do not build for a non-PSRAM or quad-PSRAM S3 variant.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; Default partition table only gives the app ~1.3MB and no filesystem
; partition at all. The setup/debug web portal needs LittleFS space for the
; step log and last-rendered-frame preview (~200KB), and the app itself
; already uses a third of the default budget - default_16MB.csv gives each
; OTA-style app slot 6.25MB and a 3.4MB LittleFS partition, comfortable
; headroom either way.
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    zinggjm/GxEPD2@^1.6.1
    adafruit/Adafruit GFX Library@^1.11.10
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

; Regenerates src/generated/icons_data.{h,cpp} from assets/icons/ before every
; build (see tools/convert_assets.py). Requires Pillow in the invoking Python
; env; if that's unavailable this is a no-op and the last-committed generated
; files are used as-is, so a fresh checkout without Pillow still builds.
extra_scripts = pre:tools/pio_prebuild.py

; Default build target: headless, drives the SerialDumpDriver debug driver
; instead of real panel hardware (see src/display/serial_dump_driver.h and
; tools/dump_to_png.py) - safe to build/flash with no panel wired up yet,
; covers Phases 0a-2.
[env:esp32-s3-devkitc-1]
extends = base

; Three real-panel builds - see docs/hardware.md for wiring per panel and
; README's "Web setup/debug portal" section for why panel choice is a build
; flag, not a runtime/web-GUI setting. All three share the same GPIO wiring
; (include/config.h's `pins` namespace); only the driver/color-pipeline
; differs. README Phase 0b still hasn't picked one of these as *the*
; supported panel - all three build, none are hardware-confirmed.

; Waveshare 7.3" ACeP (GxEPD2_730c_ACeP_730, 7-color, ~28-40s refresh).
[env:esp32-s3-devkitc-1-panel-acep730]
extends = base
build_flags =
    ${base.build_flags}
    -DWEATHER_PANEL_ACEP730

; Waveshare 7.5" e-Paper V2 (GxEPD2_750_GDEY075T7, monochrome, ~1.2s full
; refresh - much better power budget than the ACeP panels, at the cost of
; color; see graphics/dither.h's floydSteinbergMono()).
[env:esp32-s3-devkitc-1-panel-mono-v2]
extends = base
build_flags =
    ${base.build_flags}
    -DWEATHER_PANEL_MONO_V2

; Pimoroni Inky Impression 7.3" (AC073TC1A, 7-color, raw SPI - no GxEPD2
; support exists for this controller, see src/display/inky_impression_driver.cpp,
; a from-scratch port of Pimoroni's own Python driver - the single least
; hardware-verified of the three).
[env:esp32-s3-devkitc-1-panel-inky]
extends = base
build_flags =
    ${base.build_flags}
    -DWEATHER_PANEL_INKY_IMPRESSION
